name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'update.json'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'update.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            task: assembleFullRelease
            debug_task: assembleFullDebug
            artifact: release-apk-full
            apk_path: app/build/outputs/apk/full/release/*.apk
            debug_artifact: debug-apk-full
            debug_apk_path: app/build/outputs/apk/full/debug/*.apk
          - variant: lite
            task: assembleLiteRelease
            debug_task: assembleLiteDebug
            artifact: release-apk-lite
            apk_path: app/build/outputs/apk/lite/release/*.apk
            debug_artifact: debug-apk-lite
            debug_apk_path: app/build/outputs/apk/lite/debug/*.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore & Build
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.jks

            cat > keystore.properties <<EOF
          storeFile=app/keystore/release.jks
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS:-slideindex}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF

            echo "SIGN_RELEASE=true" >> "$GITHUB_ENV"
            ./gradlew ${{ matrix.task }} --build-cache
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "Release signing secrets not configured; building debug variant."
            fi
            echo "SIGN_RELEASE=false" >> "$GITHUB_ENV"
            ./gradlew ${{ matrix.debug_task }} --build-cache
          fi

      - name: Verify release APK
        if: env.SIGN_RELEASE == 'true'
        run: bash scripts/verify-release-apk.sh ${{ matrix.variant }}

      - name: Upload release APK
        if: env.SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.apk_path }}
          if-no-files-found: error

      - name: Upload debug APK
        if: env.SIGN_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.debug_artifact }}
          path: ${{ matrix.debug_apk_path }}
          if-no-files-found: error

  unit-tests:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 根工程的自定义聚合任务：:app 只跑 fullDebug，其余模块各跑 debug 单测。
      # 不用 `./gradlew test`——AGP 会为 app 的 8 个变体各跑一遍同一套用例。
      - name: Run unit tests
        run: ./gradlew unitTests --build-cache --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  translations:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Translation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The hardcoded-string guard diffs against the base commit, so it needs real history.
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      # No Gradle here on purpose: `lint` cannot cover this, because
      # app/build.gradle.kts disables MissingTranslation / ExtraTranslation.
      - name: Check locale completeness & values structure
        run: python scripts/check-translations.py

      # check-translations.py only sees resources that exist. This catches the other half: a
      # Compose screen (or Toast) whose Chinese never became a resource at all — lint's
      # HardcodedText ignores Compose literals, so nothing else would have noticed.
      - name: Check for hardcoded Chinese in new Kotlin lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check-hardcoded-strings.py --diff "${BASE_SHA:-HEAD}"

  lint:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintLiteDebug --build-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-liteDebug.html
          if-no-files-found: ignore
